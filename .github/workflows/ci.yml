name: OSPA Public Edition Offline CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and public package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
          .venv/bin/python -m pip check
      - name: Compile and verify CLI
        run: |
          .venv/bin/python -m compileall -q src scripts tests
          .venv/bin/python -m oracle_spa.cli --help
          .venv/bin/python -m oracle_spa.cli list-queries
          git diff --check
          .venv/bin/python scripts/check_documentation_links.py
      - name: Offline tests
        run: env -u ORACLE_DSN -u ORACLE_USER -u ORACLE_PASSWORD .venv/bin/python -m pytest -q tests/unit
      - name: Regenerate and compare offline reports
        run: |
          env -u ORACLE_DSN -u ORACLE_USER -u ORACLE_PASSWORD .venv/bin/python -m oracle_spa.cli report-all --output results/phase5
          env -u ORACLE_DSN -u ORACLE_USER -u ORACLE_PASSWORD .venv/bin/python -m oracle_spa.cli report-all --output results/phase5-recheck
          .venv/bin/python scripts/verify_public_reports.py results/phase5 results/phase5-recheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-offline-reports
          path: results/phase5/
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npm run data:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
